<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiantes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="contenedor">
        <h2>Registro de Nuevos Alumnos</h2>
        <p class="subtitulo">Por favor completa tus datos para el acceso al sistema.</p>

        <form action="/procesar" method="POST">
            <fieldset>
                <legend>Datos Personales</legend>

                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej. Ana Torres">
                </div>

                <div class="campo">
                    <label for="codigo">Código de estudiante</label>
                    <input type="text" id="codigo" name="codigo" required pattern="[0-9]{8}" placeholder="8 dígitos numéricos" title="Deben ser exactamente 8 números">
                </div>

                <div class="campo">
                    <label for="fnacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fnacimiento" name="fnacimiento" min="1950-01-01" max="2008-12-31" required>
                </div>

                <div class="campo">
                    <label for="carrera">Carrera</label>
                    <select id="carrera" name="carrera" required>
                        <option value="" disabled selected>Elige una opción...</option>
                        <option value="sistemas">Ingeniería de Sistemas</option>
                        <option value="software">Ingeniería de Software</option>
                        <option value="ciencias">Ciencia de la Computación</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Turno</label>
                    <div class="opciones-radio">
                        <label><input type="radio" name="turno" value="mañana" required> Mañana</label>
                        <label><input type="radio" name="turno" value="tarde"> Tarde</label>
                        <label><input type="radio" name="turno" value="noche"> Noche</label>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Datos de la Cuenta</legend>

                <div class="campo">
                    <label for="correo">Correo institucional</label>
                    <input type="email" id="correo" name="correo" required placeholder="tu.usuario@universidad.edu.pe">
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required minlength="8" pattern="(?=.*\d)(?=.*[A-Z]).{8,}" placeholder="Mínimo 8 caracteres (1 mayúscula y 1 número)" title="Debe tener al menos 8 caracteres, una letra mayúscula y un número">
                </div>

                <div class="campo">
                    <label for="comentarios">Comentarios</label>
                    <textarea id="comentarios" name="comentarios" rows="3" placeholder="Algo que quieras agregar..."></textarea>
                </div>

                <div class="campo checkbox">
                    <label>
                        <input type="checkbox" name="terminos" required> Acepto los términos y condiciones
                    </label>
                </div>
            </fieldset>

            <button type="submit" class="boton-enviar">Guardar Registro</button>
        </form>
    </div>

</body>
</html>
