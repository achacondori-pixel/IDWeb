<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestor de Tareas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="p-4">

    <div class="container" style="max-width: 700px; border: 1px solid #ddd; padding: 20px; border-radius: 5px; background: white;">
        <h3>Mis Tareas Universitarias</h3>
        <hr>

        <div id="alertas"></div>

        <form id="form-tareas" class="mb-3">
            <div class="mb-2">
                <label>Título de la tarea:</label>
                <input type="text" class="form-control" id="titulo">
            </div>
            <div class="mb-2">
                <label>Curso:</label>
                <input type="text" class="form-control" id="curso">
            </div>
            <div class="mb-2">
                <label>Fecha límite:</label>
                <input type="date" class="form-control" id="fecha">
            </div>
            <button type="submit" class="btn btn-primary mt-2">Guardar Tarea</button>
        </form>

        <div class="mb-3">
            <strong>Filtrar: </strong>
            <button class="btn btn-sm btn-outline-dark" onclick="setFiltro('todas')">Todas</button>
            <button class="btn btn-sm btn-outline-dark" onclick="setFiltro('pendientes')">Pendientes</button>
            <button class="btn btn-sm btn-outline-dark" onclick="setFiltro('completadas')">Completadas</button>
        </div>

        <h4>Lista:</h4>
        <div id="lista-tareas"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
